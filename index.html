<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Casa de Papel — Opération Arturito</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap');

:root {
  --red: #cc1a1a;
  --red2: #8a0f0f;
  --gold: #c9a84c;
  --bg: #0a0603;
  --bg2: #120c07;
  --bg3: #1c1208;
  --paper: #f5efe0;
  --text: rgba(245,239,224,0.9);
  --text-dim: rgba(245,239,224,0.45);
  --text-faint: rgba(245,239,224,0.2);
  --border: rgba(245,239,224,0.1);
  --border2: rgba(204,26,26,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Crimson Pro', Georgia, serif; overflow: hidden; }

body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
  pointer-events: none; z-index: 998;
}

#app { height: 100dvh; display: flex; flex-direction: column; }
.screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── SPLASH ── */
#screen-splash {
  align-items: center; justify-content: center; position: relative; overflow: hidden;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(204,26,26,0.13) 0%, transparent 70%), var(--bg);
}
.splash-lines { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(204,26,26,0.03) 40px, rgba(204,26,26,0.03) 41px); }
.splash-inner { position: relative; text-align: center; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; }
.splash-eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); margin-bottom: 24px; animation: fadeIn 0.8s ease 0.2s both; }
.splash-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px, 16vw, 88px); line-height: 0.9; color: var(--paper); text-shadow: 0 0 60px rgba(204,26,26,0.3); margin-bottom: 6px; animation: fadeIn 0.8s ease 0.35s both; }
.splash-title span { color: var(--red); display: block; }
.splash-sub { font-size: 18px; color: var(--text-dim); font-style: italic; margin-bottom: 48px; animation: fadeIn 0.8s ease 0.5s both; }
.splash-deco { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--red), transparent); margin: 0 auto 48px; animation: fadeIn 0.8s ease 0.6s both; }
.btn-primary { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.12em; color: var(--paper); background: var(--red); border: none; padding: 18px 48px; border-radius: 2px; cursor: pointer; animation: fadeIn 0.8s ease 0.7s both; box-shadow: 0 0 40px rgba(204,26,26,0.3); transition: all 0.2s; }
.btn-primary:active { transform: scale(0.97); background: var(--red2); }
.splash-disclaimer { margin-top: 24px; font-size: 13px; color: var(--text-faint); font-style: italic; animation: fadeIn 0.8s ease 0.9s both; }

/* ── GAME ── */
#screen-game { background: var(--bg); overflow: hidden; }

.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
.topbar-back { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: 'Bebas Neue', sans-serif; font-size: 18px; padding: 4px 10px; border-radius: 2px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
.topbar-back:active { color: var(--text); border-color: var(--text-dim); }
.topbar-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.08em; color: var(--red); }
.topbar-step { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; }
.topbar-progress { display: flex; gap: 4px; align-items: center; }
.prog-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
.prog-dot.done { background: var(--red2); }
.prog-dot.active { background: var(--red); box-shadow: 0 0 6px var(--red); width: 14px; border-radius: 3px; }

.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

/* acte banner */
.acte-banner { position: relative; padding: 32px 24px 24px; background: linear-gradient(180deg, var(--bg3) 0%, var(--bg) 100%); border-bottom: 1px solid var(--border); overflow: hidden; }
.acte-banner::before { content: attr(data-num); position: absolute; right: -10px; top: -20px; font-family: 'Bebas Neue', sans-serif; font-size: 120px; color: rgba(204,26,26,0.06); line-height: 1; pointer-events: none; }
.acte-tag { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
.acte-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 0.04em; color: var(--paper); line-height: 1; margin-bottom: 6px; }
.acte-loc { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.08em; }
.acte-loc.hidden-loc { color: transparent; background: rgba(245,239,224,0.08); border-radius: 2px; user-select: none; pointer-events: none; }

/* blocks */
.blocks { padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 16px; }
.block { border-radius: 3px; overflow: hidden; animation: blockIn 0.4s ease both; }
@keyframes blockIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* hidden blocks — revealed after code */
.block-hidden { display: none; }
.block-hidden.revealed { display: block; animation: revealIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both; }
@keyframes revealIn { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* narrative */
.block-narrative { background: var(--bg2); border: 1px solid var(--border); padding: 18px 20px; font-size: 16px; line-height: 1.75; }
.block-narrative em { color: var(--gold); font-style: italic; }

/* vocal */
.block-vocal { background: #0d0404; border: 1px solid var(--border2); position: relative; }
.block-vocal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--red2), var(--red), var(--red2)); }
.vocal-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid rgba(204,26,26,0.15); }
.vocal-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 16px rgba(204,26,26,0.4); font-size: 16px; }
.vocal-from { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; }
.vocal-name { font-size: 15px; font-weight: 600; color: var(--paper); }
.vocal-player { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
audio { width: 100%; border-radius: 2px; }
.vocal-transcript-btn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); background: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 2px; cursor: pointer; align-self: flex-start; transition: all 0.2s; }
.vocal-transcript { display: none; padding: 12px 16px; background: rgba(0,0,0,0.3); font-size: 14px; font-style: italic; color: rgba(245,239,224,0.6); line-height: 1.8; border-top: 1px solid var(--border); }
.vocal-transcript.open { display: block; animation: fadeIn 0.3s ease; }

/* enigme */
.block-enigme { background: var(--bg2); border: 1px solid var(--gold); border-left: 3px solid var(--gold); padding: 18px 20px; }
.enigme-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.enigme-text { font-size: 16px; line-height: 1.75; font-style: italic; }

/* instruction */
.block-instruction { background: rgba(204,26,26,0.06); border: 1px solid var(--border2); border-left: 3px solid var(--red); padding: 16px 18px; }
.instruction-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
.instruction-text { font-size: 15px; line-height: 1.7; }

/* whatsapp */
.block-whatsapp { background: rgba(37,211,102,0.06); border: 1px solid rgba(37,211,102,0.2); padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.wa-icon { width: 36px; height: 36px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
.wa-text { flex: 1; }
.wa-title { font-size: 14px; font-weight: 600; color: var(--paper); margin-bottom: 2px; }
.wa-sub { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

/* media */
.block-media { background: var(--bg2); border: 1px solid var(--border); overflow: hidden; }
.media-label { padding: 10px 16px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.media-img { width: 100%; display: block; filter: brightness(0.88) contrast(1.08) saturate(0.8); }
.media-error { display: none; padding: 14px 16px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--red); }

/* code input */
.block-code-input { background: var(--bg2); border: 1px solid var(--border); padding: 20px; }
.code-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
.code-field-wrap { display: flex; gap: 10px; }
.code-field { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 14px 16px; font-family: 'DM Mono', monospace; font-size: 22px; color: var(--paper); letter-spacing: 0.2em; text-align: center; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
.code-field:focus { border-color: var(--red); }
.code-field.error { border-color: var(--red); animation: shake 0.3s ease; }
.code-field.success { border-color: #2a8a2a; color: #6fcf6f; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.code-submit { background: var(--red); color: var(--paper); border: none; padding: 14px 20px; border-radius: 2px; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
.code-submit:active { background: var(--red2); transform: scale(0.97); }
.code-feedback { margin-top: 10px; min-height: 18px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; }
.code-feedback.ok { color: #6fcf6f; }
.code-feedback.ko { color: var(--red); }

/* next button */
.btn-next-wrap { padding: 12px 20px; flex-shrink: 0; background: var(--bg); border-top: 1px solid var(--border); }
.btn-next { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 2px; padding: 16px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.1em; color: var(--text-dim); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn-next:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-next.unlocked { background: var(--red); color: var(--paper); border-color: var(--red); box-shadow: 0 0 30px rgba(204,26,26,0.2); }
.btn-next.unlocked:active { transform: scale(0.98); }
.bottom-safe { height: env(safe-area-inset-bottom, 8px); background: var(--bg); flex-shrink: 0; }

/* final */
#screen-final { align-items: center; justify-content: center; text-align: center; padding: 40px 32px; overflow-y: auto; background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(204,26,26,0.12) 0%, transparent 70%), var(--bg); }
.final-inner { max-width: 400px; margin: 0 auto; }
.final-icon { font-size: 48px; margin-bottom: 20px; }
.final-title { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: var(--paper); line-height: 1; margin-bottom: 8px; }
.final-title span { color: var(--red); }
.final-text { font-size: 18px; font-style: italic; color: var(--text-dim); line-height: 1.8; margin-bottom: 32px; }
.final-bella { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 0.1em; }
</style>
</head>
<body>
<div id="app">

  <div id="screen-splash" class="screen active">
    <div class="splash-lines"></div>
    <div class="splash-inner">
      <div class="splash-eyebrow">Opération confidentielle — Barcelone</div>
      <div class="splash-title">La Casa<span>de Papel</span></div>
      <div class="splash-sub">L'EVG d'Arturito</div>
      <div class="splash-deco"></div>
      <button class="btn-primary" onclick="startGame()">COMMENCER L'OPÉRATION</button>
      <div class="splash-disclaimer">Dossier classifié — Ne pas perdre cet appareil</div>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div class="topbar">
      <button class="topbar-back" id="btn-back" onclick="goBack()" style="display:none">←</button>
      <div class="topbar-logo">CDP</div>
      <div class="topbar-progress" id="progress-dots"></div>
      <div class="topbar-step" id="step-label">ACTE 1 / 6</div>
    </div>
    <div class="content" id="game-content"></div>
    <div class="btn-next-wrap">
      <button class="btn-next" id="btn-next" disabled onclick="nextActe()">
        <span>CONTINUER</span>
        <span>→</span>
      </button>
    </div>
    <div class="bottom-safe"></div>
  </div>

  <div id="screen-final" class="screen">
    <div class="final-inner">
      <div class="final-icon">🎉</div>
      <div class="final-title">Bella<span>Ciao</span></div>
      <div class="final-text">L'opération est terminée.<br>Arturito est libre.<br>Monica aussi, d'ailleurs.</div>
      <div class="final-bella">BELLA CIAO, BELLA CIAO</div>
    </div>
  </div>

</div>

<script>
const BASE = 'https://raw.githubusercontent.com/titouan-alt/Escape-game-Barcelona/main/';
const AUDIO = {
  professeur: BASE + 'ElevenLabs_2026-05-19T19_17_24_Edward - British, Dark, Seductive, Low_pvc_sp87_s78_sb79_se38_b_m2.mp3',
  sierra:     BASE + 'ElevenLabs_2026-05-19T19_32_54_Caty - Droll, Wry and Dry_pvc_sp100_s50_sb75_se0_b_m2.mp3',
  arturito1:  BASE + 'ElevenLabs_2026-05-19T19_21_46_Martin Osborne - Polished and Intense_pvc_sp114_s30_sb75_se49_b_m2.mp3',
  arturito2:  BASE + 'ElevenLabs_2026-05-19T19_34_04_Martin Osborne - Polished and Intense_pvc_sp114_s30_sb75_se49_b_m2.mp3',
};
const IMG = {
  barri:           BASE + 'photo-barri.jpg',
  consigneFermee:  BASE + 'photo-consigne-fermee.jpg',
  consigneOuverte: BASE + 'photo-consigne-ouverte.jpg',
  batllo:          BASE + 'photo-batllo.jpg',
  enigmeBatllo:    BASE + 'photo-enigme-batllo.jpg',
  sagrada:         BASE + 'photo-sagrada.jpg',
};

// block types:
//   narrative, vocal, enigme, instruction, whatsapp, photo
//   code-input : valide un code et révèle les blocs "hidden" qui suivent
//   --- blocks après un code-input avec hidden:true sont masqués jusqu'à validation

const ACTES = [
  {
    num:'01', tag:'Acte 1', title:'Le Briefing', loc:'📍 Arc de Triomf',
    autoUnlock: true,
    blocks:[
      {type:'narrative', text:'L\'opération commence. <em>Ne perdez pas Arturito.</em>'},
      {type:'vocal', from:'Message chiffré', name:'Le Professeur', icon:'🎭', audio: AUDIO.professeur,
       transcript:'Bella ciao. Si vous entendez ce message, c\'est que l\'opération a commencé. Arturito a disparu depuis hier soir. Il nous a laissé une seule piste — une photo prise dans le Barri Gòtic. Regardez bien cette photo. Trouvez l\'endroit exact. Quand vous y êtes — photographiez et envoyez au Professeur sur WhatsApp. Faites vite. Monica arrive demain. Bella ciao.'},
      {type:'photo', caption:'Dernière trace connue d\'Arturito', src: IMG.barri},
      {type:'whatsapp', title:'Envoyez votre photo au Professeur', sub:'Quand vous êtes au bon endroit — photographiez et envoyez sur WhatsApp. Il vous répondra avec un code.'},
    ]
  },
  {
    num:'02', tag:'Acte 2', title:'La Piste Froide', loc:'📍 Barri Gòtic — Plaça de Sant Felip Neri',
    autoUnlock: false,
    blocks:[
      {type:'narrative', text:'Ces murs ont de la mémoire. Arturito s\'est arrêté ici hier soir.'},
      {type:'code-input', label:'Code reçu du Professeur sur WhatsApp', placeholder:'····', answer:'FELIP',
       feedback_ok:'Bonne localisation. Message d\'Arturito débloqué.', feedback_ko:'Code incorrect. Vérifiez avec le Professeur.'},
      {type:'vocal', from:'Message reçu', name:'Arturito', icon:'😰', audio: AUDIO.arturito1, hidden:true,
       transcript:'Allo ? C\'est moi. Écoutez… j\'ai fait une connerie. Pendant le dernier braquage j\'ai ramassé une clé USB qui traînait. Je savais pas ce que c\'était. Maintenant je sais. Et je crois que quelqu\'un d\'autre le sait aussi. Je suis plus en sécurité. Rejoignez-moi Plaça de Catalunya — fontaine centrale. Venez pas tous ensemble. Et… dites rien à Monica.'},
      {type:'instruction', label:'Prochaine étape', text:'Direction Plaça de Catalunya. Fontaine centrale. Une fois sur place, prenez une photo de groupe et envoyez-la au Professeur.', hidden:true},
    ]
  },
  {
    num:'03', tag:'Acte 3', title:'La Police Arrive', loc:'📍 Plaça de Catalunya',
    autoUnlock: false,
    blocks:[
      {type:'narrative', text:'Fontaine centrale. Quelqu\'un vous observe.'},
      {type:'whatsapp', title:'Photo de groupe — fontaine centrale', sub:'Envoyez au Professeur. Il vous répondra avec un code.'},
      {type:'code-input', label:'Code reçu du Professeur sur WhatsApp', placeholder:'····', answer:'SIERRA',
       feedback_ok:'Transmission reçue. Message de Sierra débloqué.', feedback_ko:'Code incorrect. Vérifiez avec le Professeur.'},
      {type:'vocal', from:'Appel entrant', name:'Inspectrice Sierra', icon:'🚔', audio: AUDIO.sierra, hidden:true,
       transcript:'Ici l\'inspectrice Sierra. Je sais qui vous êtes. Je sais ce que vous cherchez. La clé USB qu\'Arturito a récupérée ne lui appartient pas. Elle ne vous appartient pas non plus. Mais je vais vous donner une chance de bien faire les choses. Passeig de Gràcia, numéro 43. Casa Batlló. La clé est dans une consigne. Trouvez le code. Récupérez la clé avant que mes hommes ne le fassent. Vous avez une heure. … Bella ciao.'},
      {type:'photo', caption:'La consigne — transmise par Sierra', src: IMG.consigneFermee, hidden:true},
      {type:'instruction', label:'Consigne', text:'Direction Casa Batlló — Passeig de Gràcia 43. Le code de la consigne est caché dans la façade.', hidden:true},
    ]
  },
  {
    num:'04', tag:'Acte 4', title:'Le Braquage Raté', loc:'📍 Casa Batlló — Passeig de Gràcia 43',
    autoUnlock: false,
    blocks:[
      {type:'narrative', text:'Vous êtes devant la façade. Le dragon vous regarde.'},
      {type:'photo', caption:'Message d\'Arturito — déchiffré', src: IMG.enigmeBatllo},
      {type:'code-input', label:'Code de la consigne', placeholder:'···', answer:'115',
       feedback_ok:'Consigne ouverte. La clé USB est récupérée.', feedback_ko:'Mauvais code. Comptez encore.'},
      {type:'photo', caption:'Consigne ouverte — clé USB récupérée', src: IMG.consigneOuverte, hidden:true},
      {type:'instruction', label:'Prochaine étape', text:'Direction Sagrada Família. Arturito a laissé une dernière trace sur la façade.', hidden:true},
    ]
  },
  {
    num:'05', tag:'Acte 5', title:'Le Rendez-Vous Manqué', loc:'📍 Sagrada Família',
    autoUnlock: false,
    blocks:[
      {type:'narrative', text:'Arturito a été vu ici ce matin. Retrouvez l\'endroit exact de cette photo sur la façade.'},
      {type:'photo', caption:'Dernière trace d\'Arturito — Sagrada Família', src: IMG.sagrada},
      {type:'whatsapp', title:'Envoyez votre photo de confirmation', sub:'Quand vous êtes au bon endroit — photographiez et envoyez au Professeur. Il vous répondra avec un code.'},
      {type:'code-input', label:'Code reçu du Professeur sur WhatsApp', placeholder:'····', answer:'GAUDI',
       feedback_ok:'Localisation confirmée. Dernier message d\'Arturito débloqué.', feedback_ko:'Code incorrect. Vérifiez avec le Professeur.'},
      {type:'vocal', from:'Appel entrant', name:'Arturito', icon:'😅', audio: AUDIO.arturito2, hidden:true,
       transcript:'Allo ? C\'est moi. Oui je sais, je sais… Écoutez je peux tout expliquer. La clé USB c\'était un accident, je vous jure. Je savais pas ce que c\'était. Et Sierra… Sierra elle est pas vraiment de la police. Enfin je crois. Bref. Je suis aux Bunkers del Carmel. Tout en haut. Venez. J\'ai quelque chose à vous montrer. Et… amenez de quoi boire.'},
      {type:'instruction', label:'Destination finale', text:'Direction Bunkers del Carmel. Tout en haut. Arturito vous attend.', hidden:true},
    ]
  },
  {
    num:'06', tag:'Acte 6 — Final', title:'Le Dénouement', loc:'📍 Bunkers del Carmel',
    autoUnlock: true,
    blocks:[
      {type:'narrative', text:'Vous y êtes. Tout en haut. <em>Barcelone à vos pieds.</em>'},
      {type:'enigme', text:'Félicitations. Vous avez retrouvé Arturito, récupéré la clé, et survécu à Sierra. Ce soir, l\'opération se poursuit — mais le dress code change. Masques autorisés. Faux billets bienvenus. La nuit commence.'},
      {type:'instruction', label:'Protocole final', text:'Photo de groupe obligatoire. Masques Dalí. Faux billets. Vue sur Barcelone. C\'est un ordre du Professeur.'},
    ]
  }
];

// ── STATE ──
let currentActe = 0;

function startGame() {
  showScreen('game');
  renderActe(0);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ── RENDER ──
function renderActe(idx) {
  currentActe = idx;
  const acte = ACTES[idx];
  const content = document.getElementById('game-content');
  content.scrollTop = 0;

  document.getElementById('progress-dots').innerHTML =
    ACTES.map((_, i) => `<div class="prog-dot ${i < idx ? 'done' : i === idx ? 'active' : ''}"></div>`).join('');
  document.getElementById('step-label').textContent = `ACTE ${idx+1} / ${ACTES.length}`;

  const locHidden = !acte.autoUnlock;
  let html = `<div class="acte-banner" data-num="${acte.num}">
    <div class="acte-tag">${acte.tag}</div>
    <div class="acte-title">${acte.title}</div>
    <div class="acte-loc${locHidden ? ' hidden-loc' : ''}" id="acte-loc">${acte.loc}</div>
  </div><div class="blocks">`;

  acte.blocks.forEach((block, bi) => {
    const hiddenClass = block.hidden ? 'block-hidden' : '';
    html += `<div class="${hiddenClass}" id="blk-${bi}" style="animation-delay:${bi*0.07}s">` + buildBlock(block, bi) + `</div>`;
  });
  html += '</div>';
  content.innerHTML = html;

  // Enter key on code fields
  content.querySelectorAll('.code-field').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.closest('[data-bi]').querySelector('.code-submit').click(); }
    });
  });

  // Back button — show only from acte 2 onwards
  const backBtn = document.getElementById('btn-back');
  backBtn.style.display = idx > 0 ? 'block' : 'none';

  // Next button
  const btn = document.getElementById('btn-next');
  if (acte.autoUnlock) {
    btn.disabled = false;
    btn.classList.add('unlocked');
  } else {
    btn.disabled = true;
    btn.classList.remove('unlocked');
  }
}

function buildBlock(block, bi) {
  switch(block.type) {

    case 'narrative':
      return `<div class="block block-narrative">${block.text}</div>`;

    case 'vocal':
      return `<div class="block block-vocal">
        <div class="vocal-header">
          <div class="vocal-icon">${block.icon}</div>
          <div>
            <div class="vocal-from">${block.from}</div>
            <div class="vocal-name">${block.name}</div>
          </div>
        </div>
        <div class="vocal-player">
          <audio controls preload="none" src="${block.audio}"></audio>
          <button class="vocal-transcript-btn" onclick="toggleTranscript(this)">LIRE LA TRANSCRIPTION</button>
        </div>
        <div class="vocal-transcript">${block.transcript}</div>
      </div>`;

    case 'enigme':
      return `<div class="block block-enigme">
        <div class="enigme-label">— Message déchiffré —</div>
        <div class="enigme-text">${block.text}</div>
      </div>`;

    case 'instruction':
      return `<div class="block block-instruction">
        <div class="instruction-label">${block.label}</div>
        <div class="instruction-text">${block.text}</div>
      </div>`;

    case 'whatsapp':
      return `<div class="block block-whatsapp">
        <div class="wa-icon">💬</div>
        <div class="wa-text">
          <div class="wa-title">${block.title}</div>
          <div class="wa-sub">${block.sub}</div>
        </div>
      </div>`;

    case 'photo':
      return `<div class="block block-media">
        <div class="media-label">${block.caption}</div>
        <img class="media-img" src="${block.src}" alt="${block.caption}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="media-error">Image non disponible — vérifiez votre connexion</div>
      </div>`;

    case 'code-input':
      return `<div class="block block-code-input" data-bi="${bi}"
        data-answer="${block.answer}"
        data-ok="${block.feedback_ok}"
        data-ko="${block.feedback_ko}">
        <div class="code-label">${block.label}</div>
        <div class="code-field-wrap">
          <input class="code-field" id="code-${bi}" type="text" placeholder="${block.placeholder}"
            maxlength="10" autocomplete="off" autocorrect="off" spellcheck="false"
            oninput="this.value=this.value.toUpperCase()">
          <button class="code-submit" onclick="submitCode(this)">OK</button>
        </div>
        <div class="code-feedback" id="code-fb-${bi}"></div>
      </div>`;

    default: return '';
  }
}

// ── LOGIC ──
function submitCode(btn) {
  const wrap = btn.closest('[data-bi]');
  const bi = parseInt(wrap.dataset.bi);
  const answer = wrap.dataset.answer;
  const feedbackOk = wrap.dataset.ok;
  const feedbackKo = wrap.dataset.ko;
  const input = document.getElementById('code-' + bi);
  const fb = document.getElementById('code-fb-' + bi);
  const val = input.value.trim().toUpperCase();

  if (val === answer.toUpperCase()) {
    input.classList.add('success');
    input.disabled = true;
    btn.disabled = true;
    fb.className = 'code-feedback ok';
    fb.textContent = '✓ ' + feedbackOk;

    // Reveal all hidden blocks that come after this code block
    setTimeout(() => revealHiddenBlocks(bi), 300);

  } else {
    input.classList.add('error');
    fb.className = 'code-feedback ko';
    fb.textContent = '✗ ' + feedbackKo;
    input.value = '';
    setTimeout(() => input.classList.remove('error'), 400);
  }
}

function revealHiddenBlocks(codeBlockIdx) {
  const acte = ACTES[currentActe];
  let delay = 0;

  // Reveal location
  const loc = document.getElementById('acte-loc');
  if (loc) { setTimeout(() => loc.classList.remove('hidden-loc'), 0); }

  // Reveal all hidden blocks after this code-input
  for (let i = codeBlockIdx + 1; i < acte.blocks.length; i++) {
    if (acte.blocks[i].hidden) {
      const el = document.getElementById('blk-' + i);
      if (el) {
        setTimeout(() => {
          el.classList.add('revealed');
          el.style.animationDelay = '0s';
        }, delay);
        delay += 150;
      }
    }
  }

  // Unlock next button after all reveals
  setTimeout(() => {
    const btn = document.getElementById('btn-next');
    btn.disabled = false;
    btn.classList.add('unlocked');
    // Scroll to bottom
    const content = document.getElementById('game-content');
    content.scrollTo({ top: content.scrollHeight, behavior: 'smooth' });
  }, delay + 200);
}

function toggleTranscript(btn) {
  const player = btn.closest('.vocal-player');
  const t = player.closest('.block-vocal').querySelector('.vocal-transcript');
  t.classList.toggle('open');
  btn.textContent = t.classList.contains('open') ? 'FERMER LA TRANSCRIPTION' : 'LIRE LA TRANSCRIPTION';
}

function goBack() {
  if (currentActe > 0) renderActe(currentActe - 1);
}

function nextActe() {
  const btn = document.getElementById('btn-next');
  if (btn.disabled) return;
  if (currentActe >= ACTES.length - 1) {
    showScreen('final');
    return;
  }
  renderActe(currentActe + 1);
}
</script>
</body>
</html>
